<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Календар виховної роботи на 2026–2027 н. р.</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --navy: #081d36;
      --navy2: #0d2b4f;
      --navy3: #123a66;

      --gold: #d9aa45;
      --gold-light: #f3d88c;
      --gold-dark: #9b6b18;

      --white: #ffffff;
      --soft-white: #f7f9fc;

      --crop: 220px;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      font-family: "Segoe UI", Arial, Helvetica, sans-serif;

      color: white;

      background:
        radial-gradient(
          circle at 10% 0%,
          rgba(54, 112, 168, .32),
          transparent 30%
        ),
        radial-gradient(
          circle at 92% 8%,
          rgba(215, 169, 69, .15),
          transparent 24%
        ),
        linear-gradient(
          145deg,
          #06182e 0%,
          #0a2341 42%,
          #071b34 100%
        );

      background-attachment: fixed;
    }

    .page {
      width: 100%;
      padding: 24px;
    }

    /* ===============================
       PREMIUM HEADER
    ================================ */

    .hero {
      position: relative;

      max-width: 1580px;
      margin: 0 auto 22px;

      min-height: 205px;

      display: grid;
      grid-template-columns: 165px 1fr 230px;
      align-items: center;
      gap: 30px;

      padding: 25px 38px;

      overflow: hidden;

      background:
        radial-gradient(
          circle at 82% 18%,
          rgba(79, 132, 187, .18),
          transparent 35%
        ),
        linear-gradient(
          125deg,
          rgba(11, 39, 70, .98),
          rgba(8, 28, 52, .98)
        );

      border: 1px solid rgba(231, 192, 101, .55);
      border-radius: 32px;

      box-shadow:
        0 28px 70px rgba(0, 0, 0, .32),
        inset 0 1px 0 rgba(255, 255, 255, .08);
    }

    .hero::before {
      content: "";

      position: absolute;
      left: 5%;
      top: 0;

      width: 90%;
      height: 3px;

      background:
        linear-gradient(
          90deg,
          transparent,
          #bd8628,
          #f3d98d,
          #bd8628,
          transparent
        );

      box-shadow:
        0 0 16px rgba(240, 204, 112, .42);
    }

    .hero::after {
      content: "";

      position: absolute;

      width: 420px;
      height: 420px;

      right: -150px;
      top: -220px;

      border-radius: 50%;

      background:
        radial-gradient(
          circle,
          rgba(241, 206, 125, .13),
          transparent 68%
        );
    }

    /* ===============================
       LOGO
    ================================ */

    .logo-wrap {
      position: relative;
      z-index: 2;

      width: 150px;
      height: 150px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;

      background:
        radial-gradient(
          circle at 40% 25%,
          rgba(255,255,255,.13),
          rgba(255,255,255,.02)
        );

      border: 3px solid #d9aa45;

      box-shadow:
        inset 0 0 25px rgba(255,255,255,.04),
        0 14px 30px rgba(0,0,0,.20);
    }

    .logo-wrap img {
      width: 142px;
      height: 142px;
      object-fit: contain;
      border-radius: 50%;
      background: #ffffff;

      filter:
        drop-shadow(0 15px 17px rgba(0,0,0,.34))
        drop-shadow(0 0 10px rgba(230,193,105,.12));
    }

    /* ===============================
       TITLES
    ================================ */

    .main-info {
      position: relative;
      z-index: 2;
    }

    .school-name {
      margin: 0 0 9px;

      color: var(--gold-light);

      font-size: 13px;
      font-weight: 800;

      letter-spacing: 2.2px;
      text-transform: uppercase;

      text-shadow:
        0 2px 7px rgba(0,0,0,.25);
    }

    h1 {
      margin: 0;

      max-width: 900px;

      color: white;

      font-size: clamp(35px, 3.8vw, 55px);
      line-height: 1.04;

      font-weight: 800;
      letter-spacing: -1.5px;

      text-shadow:
        0 6px 18px rgba(0,0,0,.22);
    }

    h1 span {
      display: block;

      margin-top: 5px;

      color: #c8ddf1;

      font-size: .68em;
      font-weight: 600;
      letter-spacing: -.4px;
    }

    .author {
      margin-top: 17px;

      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 9px;

      color: #aebfd2;

      font-size: 16px;
    }

    .author strong {
      color: white;
      font-weight: 750;
    }

    .author-dot {
      width: 6px;
      height: 6px;

      display: inline-block;

      background: var(--gold);
      border-radius: 50%;

      box-shadow:
        0 0 8px rgba(222,174,72,.65);
    }

    /* ===============================
       3D GOLD YEAR CARD
    ================================ */

    .year-card {
      position: relative;
      z-index: 2;

      min-width: 220px;

      padding: 22px 25px;

      text-align: center;

      color: #102d4d;

      background:
        linear-gradient(
          145deg,
          #fff5cf 0%,
          #e3b957 38%,
          #f5da8c 60%,
          #bc8528 100%
        );

      border:
        1px solid rgba(255, 236, 179, .95);

      border-radius: 22px;

      box-shadow:
        inset 0 2px 2px rgba(255,255,255,.85),
        inset 0 -4px 9px rgba(127,80,12,.18),
        0 10px 0 #8c611c,
        0 20px 30px rgba(0,0,0,.25);
    }

    .year-card strong {
      display: block;

      font-size: 25px;
      font-weight: 850;

      text-shadow:
        0 1px 0 rgba(255,255,255,.65);
    }

    .year-card span {
      display: block;

      margin-top: 5px;

      color: #5a461d;

      font-size: 13px;
      font-weight: 650;
    }

    /* ===============================
       WHITE CALENDAR
    ================================ */

    .calendar-shell {
      position: relative;

      max-width: 1580px;
      margin: 0 auto;

      padding: 8px;

      background:
        linear-gradient(
          135deg,
          #f7e2a5,
          #b97c18,
          #f5dc96,
          #a56e16
        );

      border-radius: 32px;

      box-shadow:
        0 30px 80px rgba(0,0,0,.35),
        0 0 0 1px rgba(255,220,137,.16);
    }

    .calendar-white {
      overflow: hidden;

      background: white;

      border-radius: 25px;

      box-shadow:
        inset 0 0 0 1px rgba(208,220,233,.8);
    }

    /*
      Ховаємо повторну верхню шапку
      Google-календаря.
    */

    .calendar-viewport {
  overflow-y: auto;
  overflow-x: hidden;
  height: 720px;

  background: white;
}

    iframe {
      position: relative;

      top: calc(var(--crop) * -1);

      width: 100%;
      height: calc(1150px + var(--crop));

      display: block;

      border: 0;

      background: white;
    }

    /* ===============================
       FOOTER
    ================================ */

    .footer-link {
      max-width: 1580px;

      margin: 16px auto 5px;

      text-align: center;

      color: #8298af;

      font-size: 13px;
    }

    .footer-link a {
      color: var(--gold-light);

      font-weight: 700;

      text-decoration: none;
    }

    .footer-link a:hover {
      color: white;
    }

    /* ===============================
       MOBILE
    ================================ */

    @media (max-width: 950px) {

      .hero {
        grid-template-columns: 125px 1fr;

        padding: 24px;
      }

      .logo-wrap {
        width: 120px;
        height: 120px;
      }

      .logo-wrap img {
        width: 115px;
        height: 115px;
      }

      .year-card {
        grid-column: 1 / -1;

        width: 100%;

        box-shadow:
          inset 0 2px 2px rgba(255,255,255,.85),
          inset 0 -3px 8px rgba(127,80,12,.16),
          0 7px 0 #8c611c,
          0 16px 25px rgba(0,0,0,.20);
      }
    }

    @media (max-width: 650px) {

      :root {
        --crop: 265px;
      }

      .page {
        padding: 10px;
      }

      .hero {
        grid-template-columns: 1fr;

        gap: 12px;

        padding: 20px 17px;

        text-align: center;

        border-radius: 24px;
      }

      .logo-wrap {
        margin: 0 auto;
      }

      .school-name {
        font-size: 11px;
        letter-spacing: 1.4px;
      }

      h1 {
        font-size: 31px;
      }

      .author {
        justify-content: center;

        font-size: 14px;
      }

      .calendar-shell {
        padding: 5px;

        border-radius: 24px;
      }

      .calendar-white {
        border-radius: 19px;
      }

      .calendar-viewport {
        height: 1300px;
      }

      iframe {
        height: calc(1300px + var(--crop));
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <section class="hero">

      <div class="logo-wrap">
        <img
          src="logo.png"
          alt="Логотип Львівського ліцею"
        >
      </div>

      <div class="main-info">

        <p class="school-name">
          Львівський ліцей Тягинської сільської ради
        </p>

        <h1>
          Календар виховної роботи
          <span>на 2026–2027 н. р.</span>
        </h1>

        <div class="author">

          <span>
            Заступник директора з виховної роботи
          </span>

          <span class="author-dot"></span>

          <strong>
            Н. С. Товстуха
          </strong>

        </div>

      </div>

      <div class="year-card">
        <strong>2026 / 2027</strong>
        <span>серпень — червень</span>
      </div>

    </section>


    <section class="calendar-shell">

      <div class="calendar-white">

        <div class="calendar-viewport">

          <iframe
            src="https://script.google.com/macros/s/AKfycbxRlRohLBMEcZtJ0us4-jPMLC62y64uETmdiLMs3EHJdqRXhur6BSACEXWVGcnBFIp-eg/exec"
            title="Календар виховної роботи"
          ></iframe>

        </div>

      </div>

    </section>


    <div class="footer-link">

      Якщо календар не відобразився —

      <a
        href="https://script.google.com/macros/s/AKfycbxRlRohLBMEcZtJ0us4-jPMLC62y64uETmdiLMs3EHJdqRXhur6BSACEXWVGcnBFIp-eg/exec"
        target="_blank"
      >
        відкрити окремо
      </a>

    </div>

  </main>

</body>
</html>
