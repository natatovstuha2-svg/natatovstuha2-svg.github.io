<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Календар виховної роботи 2026–2027</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at top left, #f4f9ff 0, transparent 35%),
        linear-gradient(135deg, #ffffff 0%, #f7fbff 55%, #fffaf0 100%);
      color: #17365d;
    }

    .page {
      width: 100%;
      min-height: 100vh;
      padding: 28px;
    }

    .header {
      max-width: 1500px;
      margin: 0 auto 22px;
      background: rgba(255,255,255,.94);
      border: 1px solid #e2ebf5;
      border-radius: 30px;
      padding: 28px 34px;
      display: flex;
      align-items: center;
      gap: 28px;
      box-shadow: 0 18px 50px rgba(48, 82, 120, .10);
    }

    .logo {
      width: 125px;
      height: 125px;
      flex: 0 0 125px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 10px 12px rgba(20,50,90,.15));
    }

    .text {
      flex: 1;
    }

    .school {
      margin: 0 0 8px;
      color: #ba8a27;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(30px, 4vw, 52px);
      line-height: 1.08;
      color: #14345b;
      font-weight: 800;
    }

    .author {
      margin-top: 16px;
      font-size: 18px;
      color: #62768d;
      line-height: 1.5;
    }

    .author strong {
      color: #17365d;
    }

    .calendar-wrap {
      max-width: 1500px;
      margin: 0 auto;
      background: white;
      border: 1px solid #e1eaf4;
      border-radius: 30px;
      overflow: hidden;
      box-shadow: 0 18px 50px rgba(48, 82, 120, .11);
    }

    iframe {
      width: 100%;
      height: 1150px;
      border: 0;
      display: block;
      background: white;
    }

    .fallback {
      max-width: 1500px;
      margin: 18px auto 0;
      text-align: center;
      color: #7a8da3;
      font-size: 14px;
    }

    .fallback a {
      color: #2769aa;
      font-weight: 700;
      text-decoration: none;
    }

    @media (max-width: 720px) {
      .page {
        padding: 12px;
      }

      .header {
        padding: 22px 18px;
        border-radius: 22px;
        flex-direction: column;
        text-align: center;
        gap: 12px;
      }

      .logo {
        width: 95px;
        height: 95px;
        flex-basis: 95px;
      }

      .author {
        font-size: 15px;
      }

      .calendar-wrap {
        border-radius: 20px;
      }

      iframe {
        height: 1300px;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <header class="header">

      <div class="logo">
        <img src="logo.png" alt="Логотип Львівського ліцею">
      </div>

      <div class="text">

        <p class="school">
          Львівський ліцей Тягинської сільської ради
        </p>

        <h1>
          Календар виховної роботи<br>
          на 2026–2027 н. р.
        </h1>

        <div class="author">
          Заступник директора з виховної роботи<br>
          <strong>Н. С. Товстуха</strong>
        </div>

      </div>

    </header>

    <section class="calendar-wrap">

      <iframe
        src="https://script.google.com/macros/s/AKfycbzwlV7h3SKCJWjrLU3AAnkfmyI527AgW5aYzfQXAnil4xB63cniTyvQAnvLWvw6i69u9Q/exec"
        title="Календар виховної роботи"
        loading="lazy">
      </iframe>

    </section>

    <div class="fallback">
      Якщо календар не відобразився,
      <a
        href="https://script.google.com/macros/s/AKfycbzwlV7h3SKCJWjrLU3AAnkfmyI527AgW5aYzfQXAnil4xB63cniTyvQAnvLWvw6i69u9Q/exec"
        target="_blank">
        відкрити календар окремо
      </a>.
    </div>

  </main>

</body>
</html>
