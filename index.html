<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Календар виховної роботи на 2026–2027 н. р.</title>

  <style>
    *{box-sizing:border-box}

    :root{
      --navy:#06182d;
      --navy2:#0a2748;
      --navy3:#123e69;
      --gold:#d8ad55;
      --gold-soft:#f0d58f;
      --white:#ffffff;
      --soft:#f7f9fc;
      --crop:220px;
    }

    html,body{
      margin:0;
      min-height:100%;
    }

    body{
      font-family:"Segoe UI",Arial,Helvetica,sans-serif;
      color:#fff;
      background:
        radial-gradient(circle at 10% 0%,rgba(43,104,161,.28),transparent 31%),
        radial-gradient(circle at 93% 8%,rgba(206,167,82,.12),transparent 24%),
        linear-gradient(145deg,#051629 0%,#092440 46%,#06182d 100%);
      background-attachment:fixed;
    }

    .page{
      width:100%;
      padding:24px;
    }

    /* =====================================
       PREMIUM MONTHLY HERO
    ====================================== */

    .hero{
      position:relative;
      max-width:1580px;
      height:330px;
      margin:0 auto 22px;
      overflow:hidden;

      border:1px solid rgba(223,187,100,.45);
      border-radius:30px;

      background:
        linear-gradient(115deg,#0a2d51 0%,#071d36 48%,#06182d 100%);

      box-shadow:
        0 28px 70px rgba(0,0,0,.30),
        inset 0 1px 0 rgba(255,255,255,.07);
    }

    .hero::before{
      content:"";
      position:absolute;
      z-index:8;
      left:5%;
      top:0;
      width:90%;
      height:2px;
      background:
        linear-gradient(90deg,transparent,#bb842b,#f2d992,#bb842b,transparent);
      box-shadow:0 0 15px rgba(238,203,116,.25);
    }

    .photo-stage{
      position:absolute;
      z-index:1;
      top:18px;
      right:18px;
      bottom:18px;
      width:61%;
      overflow:hidden;

      border:1px solid rgba(255,255,255,.14);
      border-radius:25px;

      background:#0b2744;

      box-shadow:
        inset 0 0 0 1px rgba(255,255,255,.04),
        0 15px 40px rgba(0,0,0,.22);
    }

    .month-photo{
      --parallax-x:0px;
      --parallax-y:0px;
      --scroll-y:0px;

      position:absolute;
      inset:-4%;
      width:108%;
      height:108%;
      object-fit:cover;

      opacity:0;

      transform:
        translate3d(
          var(--parallax-x),
          calc(var(--parallax-y) + var(--scroll-y)),
          0
        )
        scale(1.095);

      transform-origin:center center;

      filter:
        saturate(1.05)
        contrast(1.025)
        brightness(.95);

      transition:
        opacity .72s ease,
        transform .16s ease-out;

      will-change:transform,opacity;
    }

    .month-photo.active{
      opacity:1;
    }

    .photo-stage::after{
      content:"";
      position:absolute;
      inset:0;
      z-index:3;
      pointer-events:none;

      background:
        linear-gradient(
          90deg,
          rgba(6,24,45,.78) 0%,
          rgba(6,24,45,.40) 22%,
          rgba(6,24,45,.08) 52%,
          rgba(6,24,45,.02) 100%
        ),
        linear-gradient(
          180deg,
          rgba(255,255,255,.05),
          transparent 22%,
          transparent 72%,
          rgba(3,15,28,.23)
        );
    }

    .glass-sheen{
      --sheen-x:0px;
      --sheen-y:0px;

      position:absolute;
      z-index:4;
      inset:-2%;
      pointer-events:none;
      border-radius:inherit;

      background:
        linear-gradient(
          115deg,
          rgba(255,255,255,.14),
          transparent 18%,
          transparent 68%,
          rgba(255,255,255,.035)
        );

      transform:
        translate3d(
          var(--sheen-x),
          var(--sheen-y),
          0
        );

      transition:transform .18s ease-out;
      will-change:transform;
    }

    .hero-shade{
      position:absolute;
      z-index:2;
      inset:0;
      pointer-events:none;

      background:
        linear-gradient(
          90deg,
          rgba(5,22,41,.98) 0%,
          rgba(6,25,46,.95) 34%,
          rgba(6,25,46,.54) 55%,
          rgba(6,25,46,.06) 76%,
          transparent 100%
        );
    }

    .hero-content{
      position:relative;
      z-index:20;
      height:100%;

      display:grid;
      grid-template-columns:125px minmax(430px,1fr);
      align-content:center;
      align-items:center;
      gap:26px;

      width:59%;
      padding:34px 0 74px 34px;
    }

    .logo-wrap{
      position:relative;
      width:108px;
      height:108px;
      display:grid;
      place-items:center;
      overflow:hidden;
      border-radius:50%;

      background:#fff;
      border:2px solid rgba(222,181,82,.92);

      box-shadow:
        0 12px 28px rgba(0,0,0,.25),
        0 0 0 4px rgba(255,255,255,.024),
        inset 0 0 0 2px rgba(255,255,255,.65);
    }

    .logo-wrap::after{
      content:"";
      position:absolute;
      inset:-3px;
      border-radius:50%;
      border:1px solid rgba(244,219,155,.35);
      box-shadow:0 0 16px rgba(229,191,99,.12);
      animation:logoBreath 6s ease-in-out infinite;
    }

    @keyframes logoBreath{
      0%,100%{opacity:.45}
      50%{opacity:.9}
    }

    .logo-wrap img{
      width:124%;
      height:124%;
      object-fit:contain;
      border-radius:50%;
      background:#fff;
      transform:scale(1.06);
    }

    .main-info{
      min-width:0;
    }

    .school-name{
      margin:0 0 8px;
      color:var(--gold-soft);
      font-size:12px;
      font-weight:800;
      letter-spacing:2px;
      text-transform:uppercase;
    }

    h1{
      margin:0;
      max-width:790px;

      font-size:clamp(34px,3.6vw,56px);
      line-height:1.02;
      font-weight:850;
      letter-spacing:-1.45px;

      color:#fff;
      background:
        linear-gradient(
          180deg,
          #ffffff 0%,
          #f7fbff 34%,
          #dce9f5 63%,
          #a9c1d7 100%
        );
      -webkit-background-clip:text;
      background-clip:text;
      -webkit-text-fill-color:transparent;

      filter:
        drop-shadow(0 2px 0 rgba(255,255,255,.22))
        drop-shadow(0 4px 0 rgba(54,87,118,.92))
        drop-shadow(0 7px 0 rgba(22,50,79,.88))
        drop-shadow(0 12px 16px rgba(0,0,0,.30));

      text-shadow:
        0 1px 0 rgba(255,255,255,.8),
        1px 2px 0 rgba(130,158,184,.78),
        2px 3px 0 rgba(72,103,132,.72),
        3px 4px 0 rgba(38,68,97,.68);
    }

    h1 span{
      display:block;
      margin-top:8px;

      font-size:.66em;
      font-weight:720;
      letter-spacing:-.35px;

      color:#d5e5f3;
      background:
        linear-gradient(
          180deg,
          #f6fbff 0%,
          #c7daeb 62%,
          #86a7c4 100%
        );
      -webkit-background-clip:text;
      background-clip:text;
      -webkit-text-fill-color:transparent;

      filter:
        drop-shadow(0 2px 0 rgba(43,73,101,.82))
        drop-shadow(0 5px 8px rgba(0,0,0,.22));
    }

    .author{
      margin-top:15px;

      display:flex;
      flex-wrap:wrap;
      align-items:center;
      gap:8px;

      color:#aebfd1;
      font-size:15px;
    }

    .author strong{
      color:#fff;
      font-weight:720;
    }

    .author-dot{
      width:5px;
      height:5px;
      border-radius:50%;
      background:var(--gold);
      box-shadow:0 0 8px rgba(222,174,72,.48);
    }

    .year-card{
      position:absolute;
      z-index:12;
      right:38px;
      top:34px;

      min-width:188px;
      padding:14px 18px;

      text-align:center;

      color:#f8fbff;

      border:1px solid rgba(221,185,94,.62);
      border-radius:14px;

      background:
        linear-gradient(145deg,rgba(7,29,52,.72),rgba(9,38,68,.58));

      backdrop-filter:blur(12px);

      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.09),
        0 10px 25px rgba(0,0,0,.18);
    }

    .year-card strong{
      display:block;
      font-size:22px;
      font-weight:800;
      letter-spacing:.03em;
    }

    .year-card span{
      display:block;
      margin-top:4px;
      color:#ead9a6;
      font-size:12px;
      font-weight:650;
    }

    .desk-foreground{
      position:absolute;
      z-index:12;
      right:-1%;
      bottom:0;

      width:60%;
      height:auto;

      pointer-events:none;

      filter:
        drop-shadow(0 18px 24px rgba(0,0,0,.24));
    }



    /* =====================================
       MONTH-SPECIFIC PHOTO FX
       only inside the landscape window
    ====================================== */

    .photo-fx{
      position:absolute;
      inset:0;
      z-index:5;
      overflow:hidden;
      pointer-events:none;
    }

    .fx-piece{
      position:absolute;
      will-change:transform,opacity;
      pointer-events:none;
    }

    /* Leaves */
    .leaf{
      top:-12%;
      width:18px;
      height:12px;
      opacity:.92;

      background:
        radial-gradient(circle at 30% 32%, rgba(255,255,255,.24), transparent 42%),
        linear-gradient(135deg, #d8b441 0%, #bfe06d 100%);

      border-radius:85% 10% 85% 10%;
      box-shadow:
        inset 0 0 0 1px rgba(255,255,255,.10),
        0 2px 5px rgba(0,0,0,.12);

      animation-name:leafFall;
      animation-timing-function:linear;
      animation-iteration-count:infinite;
    }

    .leaf.leaf-october{
      background:
        radial-gradient(circle at 30% 32%, rgba(255,255,255,.22), transparent 42%),
        linear-gradient(135deg, #f8d94f 0%, #e3a617 100%);
    }

    .leaf::after{
      content:"";
      position:absolute;
      left:48%;
      top:1px;
      bottom:1px;
      width:1px;
      background:rgba(120,78,22,.35);
      transform:rotate(18deg);
    }

    @keyframes leafFall{
      0%{
        transform:translate3d(0,-20px,0) rotate(0deg);
        opacity:0;
      }
      8%{
        opacity:.95;
      }
      100%{
        transform:translate3d(var(--fall-x), 118%, 0) rotate(var(--rot-end));
        opacity:0;
      }
    }

    /* Rain */
    .raindrop{
      top:-18%;
      width:2px;
      height:70px;
      opacity:.42;

      background:
        linear-gradient(
          180deg,
          rgba(255,255,255,0),
          rgba(212,232,255,.88)
        );

      border-radius:999px;
      filter:blur(.15px);

      animation-name:rainFall;
      animation-timing-function:linear;
      animation-iteration-count:infinite;
    }

    @keyframes rainFall{
      0%{
        transform:translate3d(0,-40px,0) rotate(14deg);
        opacity:0;
      }
      10%{
        opacity:.42;
      }
      100%{
        transform:translate3d(56px, 125%, 0) rotate(14deg);
        opacity:0;
      }
    }

    /* Snow */
    .snowflake{
      top:-10%;
      width:8px;
      height:8px;
      border-radius:50%;
      opacity:.92;

      background:
        radial-gradient(circle at 35% 35%, #ffffff 0%, #eef6ff 58%, rgba(255,255,255,.15) 100%);

      box-shadow:0 0 8px rgba(255,255,255,.24);

      animation-name:snowFall;
      animation-timing-function:linear;
      animation-iteration-count:infinite;
    }

    .snowflake.big{
      width:11px;
      height:11px;
      opacity:.98;
    }

    @keyframes snowFall{
      0%{
        transform:translate3d(0,-16px,0) rotate(0deg);
        opacity:0;
      }
      10%{
        opacity:.95;
      }
      100%{
        transform:translate3d(var(--snow-x), 118%, 0) rotate(270deg);
        opacity:0;
      }
    }

    /* =====================================
       CALENDAR SHELL
    ====================================== */

    .calendar-shell{
      position:relative;
      max-width:1580px;
      margin:0 auto;
      padding:6px;

      border:1px solid rgba(212,171,78,.30);
      border-radius:27px;

      background:
        linear-gradient(
          135deg,
          rgba(233,207,144,.92),
          rgba(176,126,39,.88),
          rgba(235,213,161,.94),
          rgba(159,107,29,.88)
        );

      box-shadow:
        0 28px 70px rgba(0,0,0,.28);
    }

    .calendar-white{
      position:relative;
      overflow:hidden;
      border-radius:21px;
      background:#fff;
      box-shadow:inset 0 0 0 1px rgba(208,220,233,.80);
    }

    .floating-week{
      position:absolute;
      top:0;
      left:0;
      right:0;
      z-index:80;

      display:grid;
      grid-template-columns:repeat(7,1fr);
      gap:7px;

      padding:9px 28px 11px;

      background:rgba(255,255,255,.975);
      border-bottom:1px solid rgba(190,207,223,.72);

      box-shadow:0 8px 18px rgba(8,29,54,.10);

      opacity:0;
      transform:translateY(-8px);
      pointer-events:none;
      transition:.2s ease;
    }

    .floating-week.show{
      opacity:1;
      transform:translateY(0);
    }

    .floating-week div{
      padding:9px 4px 8px;

      text-align:center;

      color:#eef5fb;
      font-size:12px;
      font-weight:800;

      border:1px solid rgba(255,255,255,.10);
      border-radius:9px;

      background:
        linear-gradient(180deg,#255b8b,#173f68);

      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.10),
        0 4px 10px rgba(12,42,73,.08);
    }

    .calendar-viewport{
      overflow-y:auto;
      overflow-x:hidden;
      height:720px;
      background:white;
    }

    iframe{
      position:relative;
      top:calc(var(--crop) * -1);

      width:100%;
      height:calc(1150px + var(--crop));

      display:block;
      border:0;
      background:white;
    }

    .footer-link{
      max-width:1580px;
      margin:16px auto 5px;

      text-align:center;
      color:#8298af;
      font-size:13px;
    }

    .footer-link a{
      color:var(--gold-soft);
      font-weight:700;
      text-decoration:none;
    }

    .footer-link a:hover{
      color:#fff;
    }

    @media(max-width:1050px){
      .hero{
        height:360px;
      }

      .photo-stage{
        width:66%;
      }

      .hero-content{
        width:70%;
        grid-template-columns:105px 1fr;
        padding-left:26px;
      }

      .logo-wrap{
        width:94px;
        height:94px;
      }

      .logo-wrap img{
        width:124%;
        height:124%;
      }

      .desk-foreground{
        width:64%;
        right:-2%;
        bottom:0;
      }
    }

    @media(max-width:720px){
      :root{
        --crop:265px;
      }

      .page{
        padding:10px;
      }

      .hero{
        height:440px;
        border-radius:23px;
      }

      .photo-stage{
        top:145px;
        left:12px;
        right:12px;
        bottom:12px;
        width:auto;
      }

      .hero-shade{
        background:
          linear-gradient(
            180deg,
            rgba(5,22,41,.99) 0%,
            rgba(5,22,41,.90) 32%,
            rgba(5,22,41,.22) 67%,
            rgba(5,22,41,.04) 100%
          );
      }

      .hero-content{
        width:100%;
        height:auto;
        grid-template-columns:72px 1fr;
        gap:14px;

        padding:24px 18px 0;
        align-content:start;
      }

      .logo-wrap{
        width:64px;
        height:64px;
      }

      .logo-wrap img{
        width:126%;
        height:126%;
      }

      .school-name{
        font-size:9px;
        letter-spacing:1.15px;
      }

      h1{
        font-size:28px;
      }

      .author{
        display:none;
      }

      .year-card{
        top:104px;
        right:18px;
        min-width:142px;
        padding:9px 12px;
      }

      .year-card strong{
        font-size:17px;
      }

      .desk-foreground{
        width:82%;
        right:-9%;
        bottom:0;
      }

      .calendar-shell{
        padding:4px;
        border-radius:22px;
      }

      .calendar-white{
        border-radius:18px;
      }

      .calendar-viewport{
        height:1300px;
      }

      iframe{
        height:calc(1300px + var(--crop));
      }
    }

    @media(prefers-reduced-motion:reduce){
      *,
      *::before,
      *::after{
        animation:none !important;
        transition:none !important;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <section class="hero">

      <div class="photo-stage">
        <img
          id="monthPhotoA"
          class="month-photo active"
          src="08-serpen.png"
          alt=""
          aria-hidden="true"
        >

        <img
          id="monthPhotoB"
          class="month-photo"
          src="08-serpen.png"
          alt=""
          aria-hidden="true"
        >

        <div class="glass-sheen"></div>
        <div id="photoFx" class="photo-fx" aria-hidden="true"></div>
      </div>

      <div class="hero-shade"></div>

      <div class="hero-content">

        <div class="logo-wrap">
          <img
            src="logo.png"
            alt="Логотип Львівського ліцею"
          >
        </div>

        <div class="main-info">

          <p class="school-name">
            Львівський ліцей Тягинської сільської ради
          </p>

          <h1>
            Календар виховної роботи
            <span>на 2026–2027 н. р.</span>
          </h1>

          <div class="author">
            <span>Заступник директора з виховної роботи</span>
            <span class="author-dot"></span>
            <strong>Н. С. Товстуха</strong>
          </div>

        </div>

      </div>

      <div class="year-card">
        <strong>2026 / 2027</strong>
        <span id="currentMonthLabel">Серпень 2026</span>
      </div>

      <img
        class="desk-foreground"
        src="teacher-desk.png"
        alt=""
        aria-hidden="true"
      >

    </section>


    <section class="calendar-shell">

      <div class="calendar-white">

        <div class="floating-week">
          <div>Пн</div>
          <div>Вт</div>
          <div>Ср</div>
          <div>Чт</div>
          <div>Пт</div>
          <div>Сб</div>
          <div>Нд</div>
        </div>

        <div class="calendar-viewport">

          <iframe
            id="calendarFrame"
            src="https://script.google.com/macros/s/AKfycbxRlRohLBMEcZtJ0us4-jPMLC62y64uETmdiLMs3EHJdqRXhur6BSACEXWVGcnBFIp-eg/exec"
            title="Календар виховної роботи"
          ></iframe>

        </div>

      </div>

    </section>


    <div class="footer-link">
      Якщо календар не відобразився —
      <a
        href="https://script.google.com/macros/s/AKfycbxRlRohLBMEcZtJ0us4-jPMLC62y64uETmdiLMs3EHJdqRXhur6BSACEXWVGcnBFIp-eg/exec"
        target="_blank"
        rel="noopener noreferrer"
      >
        відкрити окремо
      </a>
    </div>

  </main>


  <script>
    const monthVisuals = {
      '2026-08': { image:'08-serpen.png', label:'Серпень 2026', fx:'none' },
      '2026-09': { image:'09-veresen.png', label:'Вересень 2026', fx:'leaves-september' },
      '2026-10': { image:'10-zhovten.png', label:'Жовтень 2026', fx:'leaves-october' },
      '2026-11': { image:'11-lystopad.png', label:'Листопад 2026', fx:'rain' },
      '2026-12': { image:'12-hruden.png', label:'Грудень 2026', fx:'snow' },

      '2027-01': { image:'01-sichen.png', label:'Січень 2027', fx:'snow' },
      '2027-02': { image:'02-lyutyi.png', label:'Лютий 2027', fx:'snow' },
      '2027-03': { image:'03-berezen.png', label:'Березень 2027', fx:'none' },
      '2027-04': { image:'04-kviten.png', label:'Квітень 2027', fx:'none' },
      '2027-05': { image:'05-traven.png', label:'Травень 2027', fx:'none' },
      '2027-06': { image:'06-cherven.png', label:'Червень 2027', fx:'none' },
      '2027-07': { image:'07-lypen.png', label:'Липень 2027', fx:'none' }
    };

    Object.values(monthVisuals).forEach(item => {
      const preloader = new Image();
      preloader.src = item.image;
    });

    const photoA = document.getElementById('monthPhotoA');
    const photoB = document.getElementById('monthPhotoB');
    const monthLabel = document.getElementById('currentMonthLabel');
    const calendarFrame = document.getElementById('calendarFrame');
    const photoFx = document.getElementById('photoFx');

    function clearPhotoFx(){
      if(photoFx){
        photoFx.innerHTML = '';
      }
    }

    function createLeaves(kind){
      if(!photoFx) return;
      clearPhotoFx();

      const amount = kind === 'leaves-october' ? 18 : 14;

      for(let i = 0; i < amount; i++){
        const leaf = document.createElement('span');
        leaf.className = 'fx-piece leaf' + (kind === 'leaves-october' ? ' leaf-october' : '');

        const left = Math.random() * 96;
        const size = 12 + Math.random() * 12;
        const duration = 7 + Math.random() * 6;
        const delay = Math.random() * -duration;
        const fallX = (-80 + Math.random() * 180).toFixed(0) + 'px';
        const rot = (-260 + Math.random() * 520).toFixed(0) + 'deg';

        leaf.style.left = left + '%';
        leaf.style.width = size + 'px';
        leaf.style.height = (size * 0.68) + 'px';
        leaf.style.animationDuration = duration + 's';
        leaf.style.animationDelay = delay + 's';
        leaf.style.setProperty('--fall-x', fallX);
        leaf.style.setProperty('--rot-end', rot);
        leaf.style.opacity = String(0.72 + Math.random() * 0.25);

        photoFx.appendChild(leaf);
      }
    }

    function createRain(){
      if(!photoFx) return;
      clearPhotoFx();

      const amount = 34;

      for(let i = 0; i < amount; i++){
        const drop = document.createElement('span');
        drop.className = 'fx-piece raindrop';

        const left = Math.random() * 100;
        const duration = 0.75 + Math.random() * 0.55;
        const delay = Math.random() * -duration;
        const height = 42 + Math.random() * 48;

        drop.style.left = left + '%';
        drop.style.height = height + 'px';
        drop.style.animationDuration = duration + 's';
        drop.style.animationDelay = delay + 's';
        drop.style.opacity = String(0.18 + Math.random() * 0.28);

        photoFx.appendChild(drop);
      }
    }

    function createSnow(){
      if(!photoFx) return;
      clearPhotoFx();

      const amount = 26;

      for(let i = 0; i < amount; i++){
        const flake = document.createElement('span');
        flake.className = 'fx-piece snowflake' + (Math.random() > 0.72 ? ' big' : '');

        const left = Math.random() * 100;
        const duration = 8 + Math.random() * 7;
        const delay = Math.random() * -duration;
        const snowX = (-45 + Math.random() * 90).toFixed(0) + 'px';

        flake.style.left = left + '%';
        flake.style.animationDuration = duration + 's';
        flake.style.animationDelay = delay + 's';
        flake.style.setProperty('--snow-x', snowX);
        flake.style.opacity = String(0.55 + Math.random() * 0.38);

        photoFx.appendChild(flake);
      }
    }

    function updatePhotoFx(monthKey){
      const visual = monthVisuals[monthKey];
      if(!visual) return;

      switch(visual.fx){
        case 'leaves-september':
          createLeaves('leaves-september');
          break;
        case 'leaves-october':
          createLeaves('leaves-october');
          break;
        case 'rain':
          createRain();
          break;
        case 'snow':
          createSnow();
          break;
        default:
          clearPhotoFx();
      }
    }

    let activePhoto = 'A';
    let activeMonth = '2026-08';

    updatePhotoFx(activeMonth);

    function setMonthVisual(monthKey){
      const visual = monthVisuals[monthKey];

      if(!visual || monthKey === activeMonth){
        return;
      }

      const incoming =
        activePhoto === 'A'
          ? photoB
          : photoA;

      const outgoing =
        activePhoto === 'A'
          ? photoA
          : photoB;

      incoming.src = visual.image;

      incoming.onload = () => {
        incoming.classList.add('active');
        outgoing.classList.remove('active');

        activePhoto =
          activePhoto === 'A'
            ? 'B'
            : 'A';

        activeMonth = monthKey;
        updatePhotoFx(monthKey);
      };

      monthLabel.textContent = visual.label;
    }

    window.addEventListener('message', event => {
      const data = event.data;

      // У Google Apps Script користувацька сторінка може працювати
      // у вкладеному sandbox-iframe, тому event.source не завжди
      // дорівнює calendarFrame.contentWindow.
      // Приймаємо лише наш чіткий тип повідомлення та лише відомі місяці.
      if(
        data &&
        data.type === 'calendar-month-changed' &&
        typeof data.month === 'string' &&
        monthVisuals[data.month]
      ){
        setMonthVisual(data.month);
      }
    });

    // =====================================
    // PREMIUM PARALLAX FOR MONTH LANDSCAPE
    // =====================================
    const hero = document.querySelector('.hero');
    const glassSheen = document.querySelector('.glass-sheen');

    let targetX = 0;
    let targetY = 0;
    let currentX = 0;
    let currentY = 0;
    let scrollShift = 0;
    let parallaxRaf = null;

    function applyParallax(){
      currentX += (targetX - currentX) * 0.10;
      currentY += (targetY - currentY) * 0.10;

      document
        .querySelectorAll('.month-photo')
        .forEach(photo => {
          photo.style.setProperty(
            '--parallax-x',
            `${currentX.toFixed(2)}px`
          );

          photo.style.setProperty(
            '--parallax-y',
            `${currentY.toFixed(2)}px`
          );

          photo.style.setProperty(
            '--scroll-y',
            `${scrollShift.toFixed(2)}px`
          );
        });

      if(glassSheen){
        glassSheen.style.setProperty(
          '--sheen-x',
          `${(-currentX * .28).toFixed(2)}px`
        );

        glassSheen.style.setProperty(
          '--sheen-y',
          `${(-currentY * .22).toFixed(2)}px`
        );
      }

      parallaxRaf = requestAnimationFrame(applyParallax);
    }

    if(
      hero &&
      !window.matchMedia('(prefers-reduced-motion: reduce)').matches
    ){
      hero.addEventListener('pointermove', event => {
        const rect = hero.getBoundingClientRect();

        const nx =
          ((event.clientX - rect.left) / rect.width) - .5;

        const ny =
          ((event.clientY - rect.top) / rect.height) - .5;

        targetX = nx * 24;
        targetY = ny * 14;
      });

      hero.addEventListener('pointerleave', () => {
        targetX = 0;
        targetY = 0;
      });

      window.addEventListener(
        'scroll',
        () => {
          const rect = hero.getBoundingClientRect();
          const progress = Math.max(
            -1,
            Math.min(
              1,
              -rect.top / Math.max(hero.offsetHeight,1)
            )
          );

          scrollShift = progress * 10;
        },
        {passive:true}
      );

      applyParallax();
    }

    const calendarViewport =
      document.querySelector('.calendar-viewport');

    const floatingWeek =
      document.querySelector('.floating-week');

    if(
      calendarViewport &&
      floatingWeek
    ){
      calendarViewport.addEventListener(
        'scroll',
        () => {
          floatingWeek.classList.toggle(
            'show',
            calendarViewport.scrollTop > 70
          );
        }
      );
    }
  </script>

</body>
</html>
